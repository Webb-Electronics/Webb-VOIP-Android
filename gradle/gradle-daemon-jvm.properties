# The JDK the Gradle daemon itself runs on.
#
# Kotlin 2.0.0 (and the KSP that ships with it) cannot parse four-segment JDK
# version strings such as Homebrew's "26.0.2.1", so the build must not simply
# inherit whatever JDK is default on the machine. Declaring the daemon JDK here
# keeps that decision in the repository instead of in a per-machine
# ~/.gradle/gradle.properties. Gradle downloads this JDK if it is not installed
# (see the foojay resolver in settings.gradle.kts).
toolchainVersion=21
